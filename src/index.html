<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>So Fly</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: ui-rounded, "SF Pro Rounded", system-ui, -apple-system, "Segoe UI", sans-serif;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background:
        radial-gradient(circle at 20% 10%, rgba(120, 190, 120, 0.18), transparent 45%),
        radial-gradient(circle at 85% 90%, rgba(60, 140, 150, 0.22), transparent 50%),
        #0a1d1f;
      color: #e3f0e6;
    }

    main {
      width: min(640px, calc(100vw - 32px));
      padding: 32px 0;
    }

    h1 {
      margin: 0;
      font-size: 2.6rem;
      letter-spacing: 0.01em;
      color: #a6e07f;
    }

    .tagline {
      margin: 4px 0 20px;
      color: rgba(227, 240, 230, 0.7);
    }

    #app, game-canvas {
      box-shadow: 0 18px 40px rgba(0, 0, 0, 0.45), 0 0 0 1px rgba(166, 224, 127, 0.18);
      border-radius: 18px;
    }

    ul {
      list-style: none;
      display: flex;
      flex-wrap: wrap;
      gap: 8px 20px;
      margin: 18px 0 0;
      padding: 0;
      font-size: 0.95rem;
      color: rgba(227, 240, 230, 0.8);
    }

    kbd {
      display: inline-block;
      min-width: 1.4em;
      padding: 1px 6px;
      margin-right: 2px;
      border-radius: 6px;
      background: rgba(227, 240, 230, 0.1);
      border: 1px solid rgba(227, 240, 230, 0.25);
      border-bottom-width: 2px;
      font: inherit;
      font-size: 0.85em;
      text-align: center;
    }
  </style>
</head>

<body>
  <main>
    <h1>So Fly</h1>
    <p class="tagline">Help the frog catch its dinner. Keep feeding it, or it shrinks back down.</p>
    <div id="app"></div>
    <ul>
      <li><kbd>&larr;</kbd><kbd>&uarr;</kbd><kbd>&rarr;</kbd><kbd>&darr;</kbd> swim</li>
      <li><kbd>Space</kbd> snap up a nearby fly</li>
    </ul>
  </main>
  <script src="index.js"></script>
</body>
</html>
